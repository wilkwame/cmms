<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style/category-stats.css?v=5">
</head>
<body>
  <page name="category-stats" id="category-stats" onshow="loadCategoryStatsPage">
  <section>
    <div class="list-page-header">
      <span class="list-page-icon"><i class="fas fa-chart-pie"></i></span>
      <div>
        <h2>Reports</h2>
        <p class="list-page-sub">Ticket volume and category breakdown at a glance</p>
      </div>
    </div>

    <div class="card-container">
      <div class="card">
        <div class="image-container icon-report">
          <i class="fas fa-file-alt"></i>
        </div>
        <div class="card-data">
          <p class="card-count" id="cs-kpi-total-reports">0</p>
          <p class="card-label">Total Tickets</p>
        </div>
      </div>
      <div class="card">
        <div class="image-container icon-tools">
          <i class="fas fa-tools"></i>
        </div>
        <div class="card-data">
          <p class="card-count" id="cs-kpi-total-work-orders">0</p>
          <p class="card-label">Total Work Orders</p>
        </div>
      </div>
      <div class="card">
        <div class="image-container icon-top-category">
          <i class="fas fa-chart-simple"></i>
        </div>
        <div class="card-data">
          <p class="card-count" id="cs-kpi-top-category">—</p>
          <p class="card-label">Most Tickets</p>
        </div>
      </div>
    </div>

    <div class="category-bars-panel card-panel">
      <div class="panel-header">
        <h4><i class="fas fa-chart-pie"></i> <span id="cs-chart-title">Tickets by Category</span></h4>
        <div class="panel-header-actions">
          <button class="btn-download-chart" action="downloadCategoryChart: png" title="Download chart as a PNG image">
            <i class="fas fa-image"></i> PNG
          </button>
          <button class="btn-download-chart" action="downloadCategoryChart: pdf" title="Download chart as a PDF document">
            <i class="fas fa-file-pdf"></i> PDF
          </button>
        </div>
      </div>
      <div class="view-toggle">
        <button class="view-toggle-btn active" id="cs-view-category" action="switchCategoryStatsView: category">By Category</button>
        <button class="view-toggle-btn" id="cs-view-department" action="switchCategoryStatsView: department">By Department</button>
        <button class="view-toggle-btn" id="cs-view-location" action="switchCategoryStatsView: location">By Location</button>
      </div>
      <p class="panel-sub" id="cs-panel-sub">Sorted by ticket volume, highest first — approved and closed tickets only</p>
      <div id="category-bars-body">
        <p class="loading-text">Loading ticket breakdown...</p>
      </div>
    </div>
  </section>
</page>
</body>
</html>
