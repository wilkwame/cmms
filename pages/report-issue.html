<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style/report-issue.css?v=17">
</head>
<body>
<page name="report-issue" id="report-issue" onshow="loadReportIssuePage" onhide="closeCameraCapture">
  <section>
    <div class="page-header">
      <div class="header-content">
        <h2><i class="fas fa-clipboard-list"></i> Submit a Ticket</h2>
        <p class="header-date">Fill in the details below — photos help staff diagnose the problem faster.</p>
      </div>
    </div>

    <div class="form-card card-panel">
      <div id="report-issue-banner" class="status-banner hidden"></div>

      <div class="field">
        <label for="ri-issue">Title <span class="required">*</span></label>
        <input type="text" id="ri-issue" maxlength="200" placeholder="e.g. Roof leakage in Block C" />
      </div>

      <div class="field">
        <label for="ri-description">Description</label>
        <textarea id="ri-description" rows="4" placeholder="What's wrong, and any details that might help"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="ri-category">Category <span class="required">*</span></label>
          <select id="ri-category">
            <option value="">Select category</option>
            <option value="1">Electrical</option>
            <option value="2">Plumbing</option>
            <option value="3">Carpentry</option>
            <option value="4">Roofing</option>
            <option value="5">HVAC</option>
            <option value="6">Civil</option>
            <option value="7">General</option>
            <option value="8">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="ri-priority">Priority <span class="required">*</span></label>
          <select id="ri-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="ri-department">Department <span class="field-hint">(optional — narrows the location list below)</span></label>
        <select id="ri-department">
          <option value="">All departments</option>
        </select>
      </div>

      <div class="field">
        <label for="ri-location-search">Location <span class="required">*</span></label>
        <div class="location-combobox">
          <input type="text" id="ri-location-search" autocomplete="off" placeholder="Search for a location..." />
          <div id="ri-location-results" class="location-results hidden"></div>
        </div>
        <div id="ri-location-custom-wrap" class="location-custom-wrap hidden">
          <input type="text" id="ri-location-custom" placeholder="Type the location name (e.g. Block D, Room 12)" />
          <p class="field-hint">Not in the list — this will be added as a new location.</p>
        </div>
      </div>

      <div class="field">
        <label>Photos <span class="field-hint">(up to 5, JPEG/PNG/WEBP, 5MB each)</span></label>
        <div class="photo-source-buttons">
          <button type="button" id="ri-camera-btn" class="btn-photo-source">
            <i class="fas fa-camera"></i> Take Photo
          </button>
          <button type="button" id="ri-gallery-btn" class="btn-photo-source">
            <i class="fas fa-images"></i> Choose from Gallery
          </button>
        </div>
        <!-- capture="environment" tells mobile browsers to open the device's
             live rear camera directly instead of the file/gallery picker.
             Desktop browsers ignore the attribute and just show a file
             dialog, so this degrades gracefully there. -->
        <input type="file" id="ri-camera-input" accept="image/jpeg,image/png,image/webp" capture="environment" hidden />
        <input type="file" id="ri-photo-input" accept="image/jpeg,image/png,image/webp" multiple hidden />
        <div id="ri-dropzone" class="dropzone">
          <i class="fas fa-cloud-arrow-up"></i>
          <p>Or drag &amp; drop photos here</p>
        </div>
        <div id="ri-photo-previews" class="photo-previews"></div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" action="clearReportIssueForm">Clear</button>
        <button type="button" class="btn-submit" id="ri-submit-btn" action="submitReportIssue"><i class="fas fa-paper-plane"></i> Submit Ticket</button>
      </div>
    </div>
  </section>

  <!-- Live camera capture — a real getUserMedia stream rather than relying on
       <input capture>, which desktop browsers mostly ignore and which even
       on mobile just hands off to the OS camera app instead of staying
       in-page. Falls back to the file input automatically if the browser/
       context doesn't support it (see wireReportIssueDropzone). -->
  <div id="ri-camera-overlay" class="camera-overlay">
    <div class="camera-modal">
      <div class="camera-header">
        <span>Take Photo</span>
        <button type="button" class="camera-close-btn" action="closeCameraCapture"><i class="fas fa-times"></i></button>
      </div>
      <div class="camera-viewport">
        <video id="ri-camera-video" autoplay playsinline muted></video>
        <img id="ri-camera-preview" alt="Captured photo" hidden />
        <p id="ri-camera-error" class="camera-error hidden"></p>
      </div>
      <div class="camera-controls">
        <button type="button" class="camera-shutter-btn" id="ri-camera-shutter" action="captureCameraPhoto" title="Take photo"></button>
        <div class="camera-review-controls hidden" id="ri-camera-review-controls">
          <button type="button" class="btn-photo-source" action="retakeCameraPhoto"><i class="fas fa-rotate-left"></i> Retake</button>
          <button type="button" class="btn-submit" action="useCameraPhoto"><i class="fas fa-check"></i> Use Photo</button>
        </div>
      </div>
    </div>
  </div>
</page>
</body>
</html>
